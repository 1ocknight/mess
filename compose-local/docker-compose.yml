
services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - pqdata:/var/lib/postgresql/data
      - ./init/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5430:5432"

  minio:
    image: minio/minio:latest
    container_name: minio 
    environment:
      MINIO_SERVER_URL: http://minio:9000
      MINIO_API_CORS_ALLOW_ORIGIN: '*'
      MINIO_NOTIFY_KAFKA_ENABLE_avatar-events: "on"
      MINIO_NOTIFY_KAFKA_BROKERS_avatar-events: "kafka:29092"
      MINIO_NOTIFY_KAFKA_TOPIC_avatar-events: "avatar-events"
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "local-dev-cluster-001"
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
      interval: 30s
      timeout: 10s
      retries: 3

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:3000/auth
      KC_HOSTNAME_ADMIN: http://localhost:7070/auth
      KC_HOSTNAME_STRICT: "false"
      KAFKA_TOPIC: keycloak-events
      KAFKA_ADMIN_TOPIC: keycloak-admin-events
      KAFKA_CLIENT_ID: keycloak
      KAFKA_EVENTS: DELETE_ACCOUNT
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: start-dev
    depends_on:
      - postgres
      - kafka
    ports:
      - "7070:8080"
    restart: unless-stopped
    volumes:
    - ./init/keycloak-kafka/target/keycloak-kafka-1.4.0-jar-with-dependencies.jar:/opt/keycloak/providers/kafka.jar
  
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --requirepass redispass
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
  
  profile:
    build:
      context: ../
      dockerfile: profile/dockerfile
    container_name: profile
    environment:
      CONFIG: /root/profile.yaml
    volumes:
      - ./configs/profile.yaml:/root/profile.yaml
    depends_on:
      - keycloak
      - postgres 
      - minio 
      - kafka
    ports:
      - "8080:8080"
    restart: unless-stopped
  
  chat:
    build:
      context: ../chat/
      dockerfile: dockerfile
    container_name: chat
    environment:
      CONFIG: /root/chat.yaml
    volumes:
      - ./configs/chat.yaml:/root/chat.yaml
    depends_on:
      - keycloak
      - postgres 
      - redis
    ports:
      - 8081:8080
    restart: unless-stopped
  
  ws:
    build:
      context: ../websocket/
      dockerfile: dockerfile
    container_name: ws
    environment:
      CONFIG: /root/ws.yaml
    volumes:
      - ./configs/ws.yaml:/root/ws.yaml
    depends_on:
      - keycloak
      - redis
    ports:
      - 8082:8080
    restart: unless-stopped

  front:
    build:
      context: ../front/
      dockerfile: dockerfile
    container_name: front
    depends_on:
      - profile
      - chat
      - ws
      - keycloak
    ports:
      - "3000:80"
    restart: unless-stopped

